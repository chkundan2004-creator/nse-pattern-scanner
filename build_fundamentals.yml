name: Build fundamentals

on:
  schedule:
    # Weekly, shortly after the universe rebuild finishes
    - cron: "30 3 * * 0"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python fundamentals_builder.py

      - name: Commit fundamentals.json if changed
        run: |
          git config user.name "nse-scanner-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet fundamentals.json; then
            git add fundamentals.json
            git commit -m "Update fundamentals"
            git push
          fi
