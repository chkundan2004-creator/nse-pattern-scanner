name: Build stock universe

on:
  schedule:
    # Once a week, Sunday early morning UTC
    - cron: "0 3 * * 0"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python universe_builder.py

      - name: Commit universe.json if changed
        run: |
          git config user.name "nse-scanner-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet universe.json; then
            git add universe.json
            git commit -m "Update universe"
            git push
          fi
