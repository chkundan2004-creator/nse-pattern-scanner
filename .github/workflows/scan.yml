name: NSE pattern scan

on:
  schedule:
    # Every 15 minutes, all day, every day — free on public repos.
    # Outside NSE market hours this just finds no new data, which is
    # harmless; it guarantees no gap right at market open/close either.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python scanner.py

      - name: Commit alerts.json if changed
        run: |
          git config user.name "nse-scanner-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet alerts.json; then
            git add alerts.json
            git commit -m "Update alerts"
            git push
          fi
